services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: harmont
      POSTGRES_USER: harmont
      POSTGRES_PASSWORD: harmont
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmont -d harmont"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
